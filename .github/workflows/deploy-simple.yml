name: Deploy - Simple Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy Application

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.0

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Show Node version
        run: |
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"

      - name: Install dependencies
        run: |
          echo "Installing dependencies..."
          npm ci
          echo "Dependencies installed successfully"

      - name: Build application
        run: |
          echo "Building application..."
          npm run build
          echo "Build completed successfully"
        continue-on-error: false

      - name: Build Cloud Functions
        run: |
          echo "Building Cloud Functions..."
          cd functions
          npm install
          npm run build
          cd ..
          echo "Cloud Functions built successfully"
        continue-on-error: false

      - name: Install Firebase CLI
        run: |
          echo "Installing Firebase CLI..."
          npm install -g firebase-tools
          echo "Firebase CLI installed"

      - name: Deploy to Firebase
        run: |
          echo "Deploying to Firebase..."
          echo "Project: ${{ secrets.FIREBASE_PROJECT_ID }}"
          firebase deploy \
            --project=${{ secrets.FIREBASE_PROJECT_ID }} \
            --token=${{ secrets.FIREBASE_TOKEN }} \
            --only hosting,functions
          echo "Deployment completed"
        continue-on-error: false

      - name: Deploy complete
        run: |
          echo "=========================================="
          echo "✅ Deployment Complete!"
          echo "=========================================="
          echo "App: https://disha-diagnostics.web.app"
          echo "Check live in 5-10 minutes"
          echo "=========================================="
        if: success()

      - name: Deployment failed
        run: |
          echo "❌ Deployment failed - check logs above"
        if: failure()
