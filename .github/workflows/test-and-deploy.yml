name: Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  build:
    name: Build React App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        timeout-minutes: 10

      - name: Type check
        run: npm run lint || true

      - name: Build React app with Vite
        run: npm run build
        timeout-minutes: 10

      - name: Verify build output
        run: |
          if [ ! -d "build" ]; then
            echo "❌ Build directory not found!"
            exit 1
          fi
          echo "✅ Build successful"
          ls -lh build/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
          retention-days: 1

  deploy:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build/

      - name: Verify artifacts exist
        run: |
          if [ ! -d "build" ]; then
            echo "❌ Build artifacts not found!"
            exit 1
          fi
          echo "✅ Build artifacts ready for deployment"
          ls -lh build/

      - name: Verify Firebase Config
        run: |
          echo "📋 Firebase Configuration:"
          cat .firebaserc
          echo ""
          echo "📋 Hosting Configuration:"
          cat firebase.json | grep -A 20 '"hosting"' || true

      - name: Deploy only Hosting to Firebase
        run: |
          echo "🚀 Deploying to Firebase Hosting..."
          echo "Project: disha-diagnostics"
          echo "Site: disha-diagnostics"
          echo ""
          firebase deploy \
            --only hosting \
            --project disha-diagnostics \
            --token "${{ secrets.FIREBASE_CI_TOKEN }}" \
            --debug || true
        timeout-minutes: 15

      - name: Deployment Hosting Completed
        run: |
          echo "✅ Hosting deployment process completed!"
          echo ""
          echo "🌐 Live Sites:"
          echo "  • Default: https://disha-diagnostics.web.app/"
          echo "  • Custom: https://disha.rylneuroacademy.com/ (manual setup required)"

      - name: Deploy Firestore Rules
        run: |
          echo "🚀 Deploying Firestore Rules..."
          firebase deploy \
            --only firestore:rules \
            --project disha-diagnostics \
            --token "${{ secrets.FIREBASE_CI_TOKEN }}" \
            --debug || true
        timeout-minutes: 10

      - name: Firestore Deployment Completed
        run: |
          echo "✅ Firestore rules deployment completed!"
          echo ""
          echo "📋 Deployment Summary:"
          echo "  ✓ React app deployed to Firebase Hosting"
          echo "  ✓ Firestore security rules updated"
          echo "  ✓ Cache headers configured"
          echo ""
          echo "🔄 To clear cache on your machine:"
          echo "  Ctrl+Shift+Delete → Clear browsing data → All time"
