name: Build & Deploy

on:
  push:
    branches:
      - main
      - remote-dev
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: Build React App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        timeout-minutes: 10

      - name: Type check
        run: npm run lint || true

      - name: Build React app with Vite
        run: npm run build
        timeout-minutes: 10

      - name: Verify build output
        run: |
          if [ ! -d "build" ]; then
            echo "❌ Build directory not found!"
            exit 1
          fi
          echo "✅ Build successful"
          ls -lh build/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
          retention-days: 1

  deploy:
    name: Deploy to Firebase & Google Cloud
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Install Cloud Functions dependencies
        run: cd functions && npm install --legacy-peer-deps && cd ..
        timeout-minutes: 10

      - name: Build Cloud Functions
        run: cd functions && npm run build && cd ..
        timeout-minutes: 10

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          version: latest

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build/

      - name: Verify artifacts exist
        run: |
          if [ ! -d "build" ]; then
            echo "❌ Build artifacts not found!"
            exit 1
          fi
          echo "✅ Build artifacts ready for deployment"
          ls -lh build/

      - name: Delete old Phase 2 functions (if they exist)
        run: |
          echo "🗑️  Cleaning up old Phase 2 functions from previous deployments..."
          firebase functions:delete batchRecalculateAllCycles --region us-central1 --quiet --project disha-diagnostics --token "${{ secrets.FIREBASE_CI_TOKEN }}" 2>/dev/null || true
          firebase functions:delete onChallengeResponseWrite --region us-central1 --quiet --project disha-diagnostics --token "${{ secrets.FIREBASE_CI_TOKEN }}" 2>/dev/null || true
          firebase functions:delete onMultiplierWrite --region us-central1 --quiet --project disha-diagnostics --token "${{ secrets.FIREBASE_CI_TOKEN }}" 2>/dev/null || true
          firebase functions:delete recalculateCycleScores --region us-central1 --quiet --project disha-diagnostics --token "${{ secrets.FIREBASE_CI_TOKEN }}" 2>/dev/null || true
          firebase functions:delete syncMultipliers --region us-central1 --quiet --project disha-diagnostics --token "${{ secrets.FIREBASE_CI_TOKEN }}" 2>/dev/null || true
          echo "✅ Cleanup complete (or functions didn't exist)"
        continue-on-error: true

      - name: Deploy to Firebase (all resources)
        run: |
          echo "🚀 Deploying all Firebase resources (Functions + Hosting + Rules)..."
          MAX_RETRIES=3
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Deployment attempt $RETRY_COUNT of $MAX_RETRIES"

            if firebase deploy \
              --project disha-diagnostics \
              --token "${{ secrets.FIREBASE_CI_TOKEN }}" \
              --debug
            then
              echo "✅ Firebase deployment succeeded!"
              exit 0
            else
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "⏳ Deployment failed, waiting 60 seconds before retry..."
                sleep 60
              else
                echo "❌ Deployment failed after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
          done
        timeout-minutes: 30

      - name: Deployment Summary
        run: |
          echo "✅ Full deployment completed!"
          echo ""
          echo "📋 Deployment Summary:"
          echo "  ✓ Cloud Functions deployed (triggers + callables)"
          echo "  ✓ Firestore security rules updated"
          echo "  ✓ React app deployed to Firebase Hosting"
          echo "  ✓ Cache headers configured"
          echo ""
          echo "🌐 Live URLs:"
          echo "  ✓ https://disha-diagnostics.web.app/ (Firebase)"
          echo "  ✓ https://disha.rylneuroacademy.com/ (Custom Domain)"
          echo ""
          echo "⏱️  Changes typically live within 5-10 minutes"
