name: Build & Deploy

on:
  push:
    branches:
      - main
      - remote-dev
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: Build React App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        timeout-minutes: 10

      - name: Type check
        run: npm run lint || true

      - name: Build React app with Vite
        run: npm run build
        timeout-minutes: 10

      - name: Verify build output
        run: |
          if [ ! -d "build" ]; then
            echo "❌ Build directory not found!"
            exit 1
          fi
          echo "✅ Build successful"
          ls -lh build/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
          retention-days: 1

  deploy:
    name: Deploy to Firebase & Google Cloud
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Install Cloud Functions dependencies
        run: cd functions && npm install --legacy-peer-deps && cd ..
        timeout-minutes: 10

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          version: latest

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build/

      - name: Verify artifacts exist
        run: |
          if [ ! -d "build" ]; then
            echo "❌ Build artifacts not found!"
            exit 1
          fi
          echo "✅ Build artifacts ready for deployment"
          ls -lh build/

      - name: Delete old analyzeCheckup function (if exists)
        run: |
          echo "🗑️  Attempting to delete old analyzeCheckup function..."
          echo "${{ secrets.FIREBASE_CI_TOKEN }}" > /tmp/gcloud-key.json
          gcloud auth activate-service-account --key-file=/tmp/gcloud-key.json
          gcloud config set project disha-diagnostics
          gcloud functions delete analyzeCheckup --region us-central1 --quiet 2>/dev/null || echo "✓ Function not found or already deleted"
          rm /tmp/gcloud-key.json
        continue-on-error: true

      - name: Deploy Cloud Functions
        run: |
          echo "🚀 Deploying Cloud Functions..."
          firebase deploy \
            --only functions \
            --project disha-diagnostics \
            --token "${{ secrets.FIREBASE_CI_TOKEN }}" \
            --debug
        timeout-minutes: 15

      - name: Deploy Firestore Rules
        run: |
          echo "🚀 Deploying Firestore Rules..."
          firebase deploy \
            --only firestore:rules \
            --project disha-diagnostics \
            --token "${{ secrets.FIREBASE_CI_TOKEN }}" \
            --debug
        timeout-minutes: 10

      - name: Deploy to Firebase Hosting
        run: |
          echo "🚀 Deploying to Firebase Hosting (Both Targets)..."
          firebase deploy \
            --only hosting:default,hosting:custom \
            --project disha-diagnostics \
            --token "${{ secrets.FIREBASE_CI_TOKEN }}" \
            --debug
        timeout-minutes: 15

      - name: Deployment Summary
        run: |
          echo "✅ Full deployment completed!"
          echo ""
          echo "📋 Deployment Summary:"
          echo "  ✓ Cloud Functions deployed (5 functions)"
          echo "  ✓ Firestore security rules updated"
          echo "  ✓ React app deployed to Firebase Hosting"
          echo "  ✓ Cache headers configured"
          echo ""
          echo "🌐 Live URLs:"
          echo "  ✓ https://disha-diagnostics.web.app/"
          echo "  ✓ https://disha.rylneuroacademy.com/"
          echo ""
          echo "⏱️  Changes live within 2-3 minutes"
