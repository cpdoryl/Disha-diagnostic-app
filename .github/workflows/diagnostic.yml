name: Diagnostic - Debug Workflow Failures

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    name: Diagnose Build Issues

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        continue-on-error: false

      - name: Check Node version
        run: node --version && npm --version

      - name: List installed packages
        run: npm list --depth=0 2>/dev/null | head -20

      - name: Try linting
        run: npm run lint 2>&1 || echo "Lint failed - but continuing"
        continue-on-error: true

      - name: Try building
        run: npm run build 2>&1 || echo "Build failed"
        continue-on-error: true

      - name: List dist directory
        run: ls -la dist/ 2>/dev/null || echo "No dist directory"

      - name: Show package.json
        run: cat package.json | grep -A 5 '"scripts"'

      - name: Summary
        run: |
          echo "=========================================="
          echo "Diagnostic Summary:"
          echo "=========================================="
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "Current dir: $(pwd)"
          echo "Files: $(ls -la | wc -l)"
          echo "=========================================="
