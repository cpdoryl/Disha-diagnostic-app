name: Deploy to Firebase

on:
  push:
    branches:
      - main
      - remote-dev
  pull_request:
    branches:
      - main
      - remote-dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account_email: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Firestore Rules
        run: |
          firebase deploy --only firestore:rules \
            --project disha-diagnostics \
            --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Deploy Cloud Functions
        run: |
          firebase deploy --only functions \
            --project disha-diagnostics \
            --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Deploy to Firebase Hosting
        run: |
          firebase deploy --only hosting \
            --project disha-diagnostics \
            --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Deployment Summary
        run: |
          echo "✅ Deployment Complete!"
          echo "🌐 Live at: https://disha-diagnostics.web.app/"
          echo "📊 Functions Dashboard: https://console.firebase.google.com/project/disha-diagnostics/functions"
          echo "🔐 Firestore: https://console.firebase.google.com/project/disha-diagnostics/firestore"

      - name: Slack Notification (Optional)
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "DISHA Diagnostics Deployment",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Status*: ${{ job.status }}\n*Branch*: ${{ github.ref }}\n*Commit*: ${{ github.sha }}"
                  }
                }
              ]
            }
